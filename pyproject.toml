[project]
name = "pixcdust"
version = "0.2.0"
description = ""
authors = [
    {name = "zawadzl",email = "lionel.zawadzki@cnes.fr"}
]
readme = "README.md"
license = "Apache-2.0"
keywords = ["SWOT", "dggs", "hydroweb", "water", "hydrology", "inland water", "coastal", "scientific data", "search", "download", "cnes"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3.0",
    "fiona>=1.9.5,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "geopandas>=1.1.3,<2.0.0",
    "h3>=3.7.6,<4.0.0",
    "astropy>=8.0.0,<9.0.0",
    "astropy-healpix>=1.1.0,<2.0.0",
    "xarray>=2024.2.0,<2025.0.0",
    "shapely>=2.0.3,<3.0.0",
    "click>=8.1.7,<9.0.0",
    "zcollection>=2026.6.0,<2027.0.0",
    "netcdf4>=1.6.5,<2.0.0",
    "tqdm>=4.66.4,<5.0.0",
    "pyogrio>=0.8.0,<0.9.0",
    "pyarrow>=16.1.0,<17.0.0",
    "py-hydroweb>=1.2.0,<2.0.0",
    "folium>=0.16.0,<0.17.0",
    "branca>=0.7.2,<0.8.0",
    "xvec>=0.3.0,<0.4.0",
    "eodag>=4.4.0,<5.0.0",
    "xdggs>=0.6.0,<0.7.0",
    "scipy>=1.18.0,<2.0.0",
]

[project.urls]
documentation = "https://pixcdust.readthedocs.io/en/latest/index.html"
repository = "https://github.com/SWOT-community/PixCDust"

[project.optional-dependencies]
dev = [
    "decorator>=5.1.1,<6.0.0",
    "ipykernel>=6.29.4,<7.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "pytest>=9.1.1,<10.0.0",
    "black>=26.5.1,<27.0.0",
    "flake8>=7.3.0,<8.0.0",
    "ruff>=0.16.5,<0.17.5",
    "pytest-cov>=7.1",
]
doc = [
    "gitpython",
    "sphinx",
    "sphinx-rtd-theme",
    "pydata-sphinx-theme",
    "sphinx-autodoc-typehints",
    "nbsphinx",
    "sphinx-autoapi",
    "ipykernel",
    "sphinx-collections",
]

[tool.poetry]
packages = [{include = "pixcdust"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
