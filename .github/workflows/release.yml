name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

# This step check cohenrece between tags version and pyproject.toml version
      - name: Verify version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]

          package_version = project["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")

          if package_version != tag_version:
              raise SystemExit(
                  f"Tag v{tag_version} != pyproject.toml"
                  f"version {package_version}"
              )

          print(f"Publishing version {package_version}")
          PY

# Install dependencies and launch linter, test, build and check distribution
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade build
          pip install ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Test
        run: pytest pixcdust/tests --realdata -v -rs

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/pixcdust/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

